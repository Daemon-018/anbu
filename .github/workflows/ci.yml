name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Test
        run: python -m pytest -q
      - name: Build the synthetic fixture and scan it
        run: |
          python tests/fixtures/apk_builder.py out/synthetic-malicious.apk
          set +e
          anbu scan out/synthetic-malicious.apk --out out --fail-on high
          status=$?
          set -e
          test "$status" -eq 3
